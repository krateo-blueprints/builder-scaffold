# Releases the ONE chart at this repository's root to oci://ghcr.io/<owner>/charts/<name>.
#
# A Krateo builder (the Blueprint Composer or the Portal Builder) seeded this file from
# krateo-blueprints/builder-scaffold. A seeded repository never receives scaffold updates, so this
# file stays a thin wrapper: packaging and pushing live in the org's release-oci.yaml@main, and a fix
# made there reaches every seeded repository without touching any of them.
#
# What releases, and when:
#   • A push to main whose Chart.yaml carries a literal version (MAJOR.MINOR.PATCH, optionally with a
#     lower-case -pre-release) that has no tag yet. That is the merge of a blueprint's pull request. The
#     version is tagged and released once; a later merge that leaves it unchanged releases nothing, so
#     a second release needs a version bump.
#   • A manual run (workflow_dispatch) on main, by the same rules as a push to main. A manual run on
#     any other branch or tag is refused.
#   • A pushed tag (MAJOR.MINOR.PATCH, optionally with a lower-case -pre-release), for a Chart.yaml that
#     carries the CHART_VERSION placeholder (a page set) or that same literal version.
# A pull request runs the same checks and releases nothing, so its check says whether the merge can.
#
# In krateo-blueprints, a released chart is then added to the organisation's helm index
# (krateo-blueprints/charts publish-chart.yaml, under that repository's PUBLISHING.md), from which the
# Marketplace installs. A blueprint goes to the blueprints channel and gets a Marketplace card, a page
# set to the pages channel. That is part of the release, not an extra: a chart in GHCR and not in the
# index is not published. So everything the index would refuse is refused before anything is
# tagged or pushed, on pull requests too, and the token is checked before the push. Repositories this
# scaffold seeded anywhere else release to their own registry and skip the index.
#
# Every version the Blueprint Composer lets a person Start at releases here: 0.1.0, 0.1.0-rc.1. Upper
# case and build metadata (0.1.0-RC1, 0.1.0+build) are refused, as the composer refuses them:
# core-provider serves a chart at version V as the API version v<V with dots as dashes>, and
# Kubernetes refuses both in an API version.
name: release

on:
  push:
    branches:
      - main
    # A filter cannot say "lower case, no build metadata", so the second pattern admits more than a
    # version; the resolve job refuses the rest.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Releases run one at a time: two runs deciding at once that a version has no tag would both try to
# release it. A pull request's checks have a group of their own and never wait for a release.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      oci_repo: ${{ steps.v.outputs.oci_repo }}
      name: ${{ steps.v.outputs.name }}
      index: ${{ steps.v.outputs.index }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Every tag comes with the full history, and "has this version been released?" is a tag lookup.
          fetch-depth: 0
          persist-credentials: false

      - id: v
        env:
          # The organisation whose helm index the release publishes to (PUBLISHING.md, Scope).
          IN_INDEX_ORG: ${{ github.repository_owner == 'krateo-blueprints' }}
        run: |
          set -euo pipefail
          echo "index=false" >> "$GITHUB_OUTPUT"
          # GHCR refuses upper case, and an org name may carry it.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "oci_repo=oci://ghcr.io/${owner}/charts" >> "$GITHUB_OUTPUT"

          # A push to main that carries no chart (an edit before the builder's pull request is merged)
          # releases nothing.
          if [ ! -f Chart.yaml ]; then
            echo "::notice::no Chart.yaml at the root yet"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n="$(find . -name Chart.yaml -not -path './.git/*' -not -path '*/charts/*' | wc -l)"
          [ "$n" -eq 1 ] || { echo "::error::$n charts; a builder repo holds exactly one, at the root"; exit 1; }

          name="$(sed -n 's/^name:[[:space:]]*//p' Chart.yaml | head -1 | tr -d "\"' ")"
          declared="$(sed -n 's/^version:[[:space:]]*//p' Chart.yaml | head -1 | tr -d "\"' ")"
          # Every version the Blueprint Composer accepts (see the header). Refusing one the composer let
          # a person Start at would strand the blueprint: the merge releases nothing, and the portal's
          # Register still offers a version that was never published.
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-z-]+(\.[0-9a-z-]+)*)?$'
          # Checked for every event, not only on main: a pull request whose check passes a version the
          # merge then refuses is a check that says the wrong thing.
          if [ "$declared" != CHART_VERSION ] && ! printf '%s' "$declared" | grep -Eq "$semver"; then
            echo "::error::version '$declared' is not MAJOR.MINOR.PATCH, optionally with a lower-case -pre-release (or the CHART_VERSION placeholder)"; exit 1
          fi
          released=false
          if [ "$declared" != CHART_VERSION ] && git rev-parse -q --verify "refs/tags/$declared" >/dev/null; then released=true; fi

          # A manual run releases main and nothing else. Run on any other branch or tag, it would tag and
          # publish a commit nobody merged, and the reviewed merge would then find the version released.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a manual run releases main only, not $GITHUB_REF"; exit 1
          fi

          release=true; tag=false; version="$declared"
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF_TYPE}" in
            pull_request:*)
              release=false
              if [ "$released" = true ]; then echo "::warning::$declared is already released, so merging this releases nothing; bump Chart.yaml's version"; fi ;;
            push:tag)
              version="$GITHUB_REF_NAME"
              # For a CHART_VERSION chart the tag IS the version, and the trigger's filter let through
              # anything after the dash.
              printf '%s' "$version" | grep -Eq "$semver" \
                || { echo "::error::tag $version is not MAJOR.MINOR.PATCH, optionally with a lower-case -pre-release"; exit 1; }
              # The composer shows the API version as v<chart version>; a package at any other version
              # would serve a different API from the one the person saw.
              [ "$declared" = CHART_VERSION ] || [ "$declared" = "$version" ] || { echo "::error::tag $version but Chart.yaml is $declared"; exit 1; } ;;
            *)
              if [ "$declared" = CHART_VERSION ]; then echo "::notice::placeholder version: release by pushing a semver tag"; release=false
              elif [ "$released" = true ]; then echo "::notice::$declared already released; bump Chart.yaml"; release=false
              else tag=true; fi ;;
          esac

          # The registration file must register what this repository publishes, or Register would
          # install a chart that is not this one, or one that does not exist.
          if [ -f compositiondefinition.yaml ]; then
            cd_name="$(awk '/^metadata:/{m=1;next} m&&/^[[:space:]]+name:/{print $2;exit}' compositiondefinition.yaml | tr -d "\"' ")"
            cd_url="$(sed -n 's/^[[:space:]]*url:[[:space:]]*//p' compositiondefinition.yaml | head -1 | tr -d "\"' ")"
            cd_ver="$(sed -n 's/^[[:space:]]*version:[[:space:]]*//p' compositiondefinition.yaml | head -1 | tr -d "\"' ")"
            [ "$cd_name" = "$name" ] || { echo "::error::CD registers '$cd_name', chart is '$name'"; exit 1; }
            [ "$cd_url" = "oci://ghcr.io/${owner}/charts/${name}" ] || { echo "::error::CD url $cd_url is not what this repo publishes"; exit 1; }
            case "$cd_ver" in CHART_VERSION|"$declared") ;; *) echo "::error::CD version $cd_ver != Chart.yaml $declared"; exit 1 ;; esac
          fi

          # The helm index, in krateo-blueprints only. This scaffold also seeds repositories in other
          # accounts and on self-hosted SCMs; they have no CHARTS_PUBLISH_TOKEN, and their charts are
          # not the organisation's to list (krateo-blueprints/charts PUBLISHING.md, Scope).
          index=false; channel=""
          if [ "$IN_INDEX_ORG" = true ]; then
            index=true
            # Every refusal below is collected and reported together, so one run names them all.
            problems=()
            # A registration file registers a chart whose CRD core-provider generates from
            # values.schema.json: one without the other is not a blueprint, whatever it is meant to be.
            if [ -f compositiondefinition.yaml ] && [ ! -f values.schema.json ]; then
              problems+=("compositiondefinition.yaml registers this chart, but values.schema.json is missing: core-provider generates the CRD from it")
            fi
            # The channel follows from the content, by the publisher's own rule (PUBLISHING.md rule 2).
            # It is decided here because the publisher refuses a chart in the wrong channel only after
            # GHCR already holds the version.
            kind="$(yq -r '.annotations["krateo.io/kind"] // ""' Chart.yaml)"
            if [ -f compositiondefinition.yaml ]; then
              if [ "$kind" = page-set ]; then channel=pages; else channel=blueprints; fi
            else
              channel=operators
            fi
            # A page set is told apart from a blueprint only by this annotation, and the Composer
            # releases a page set by tag with the CHART_VERSION placeholder. One without it would be
            # listed on the Marketplace as a blueprint.
            if [ "$declared" = CHART_VERSION ] && [ "$channel" = blueprints ]; then
              problems+=("Chart.yaml carries the CHART_VERSION placeholder, as a page set does, but no 'krateo.io/kind: page-set' annotation, so it would be listed on the Marketplace as a blueprint. Add the annotation, or give the chart a literal version if it is a blueprint")
            fi
            # What the index refuses (publish-chart.yaml's content gate, PUBLISHING.md rule 3), refused
            # here, before a merge can release a chart the index then turns away.
            src_url="https://github.com/${GITHUB_REPOSITORY}"
            SRC_URL="$src_url" yq -e '(.sources // [])[] | select(. == strenv(SRC_URL))' Chart.yaml >/dev/null 2>&1 \
              || problems+=("Chart.yaml needs 'sources:' listing ${src_url}")
            # The repository that released it: the index's owner of the name (rule 6), and what the
            # portal requires before it gives a live-index chart a Marketplace card.
            [ "$(yq -r '.annotations["krateo.io/source-repo"] // ""' Chart.yaml)" = "$GITHUB_REPOSITORY" ] \
              || problems+=("Chart.yaml needs 'annotations: krateo.io/source-repo: ${GITHUB_REPOSITORY}'")
            if [ "$channel" != operators ]; then
              case "$(yq -r '.icon // ""' Chart.yaml)" in https://*) ;; *) problems+=("Chart.yaml needs an https 'icon'") ;; esac
              [ "$(yq -r '(.keywords // []) | length' Chart.yaml)" -gt 0 ] || problems+=("Chart.yaml needs 'keywords:', the Marketplace's tags")
            fi
            if [ "${#problems[@]}" -gt 0 ]; then
              for m in "${problems[@]}"; do echo "::error::${m} (krateo-blueprints/charts PUBLISHING.md)"; done
              exit 1
            fi
            echo "::notice::$name is published to the ${channel} channel of the krateo-blueprints helm index"
          fi
          { echo "release=$release"; echo "tag=$tag"; echo "version=$version"; echo "name=$name"; echo "index=$index"; echo "channel=$channel"; } >> "$GITHUB_OUTPUT"

      # Before anything is tagged or pushed: a release whose index step cannot write would leave GHCR
      # holding a version the Marketplace never sees, which is how 0.2.0 outlived every later
      # release of openstack. Read-only, one GET, with the token the index job passes.
      - name: the index token can write to krateo-blueprints/charts
        if: steps.v.outputs.release == 'true' && steps.v.outputs.index == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::the org secret CHARTS_PUBLISH_TOKEN is not available to this repository, so the release could not reach the helm index. Nothing was tagged or pushed."; exit 1
          fi
          # A token with whitespace or a control character in it (usually a trailing newline from
          # `echo ... | gh secret set`) passes the API, which trims it, then breaks git in the
          # publisher after GHCR already holds the version (PUBLISHING.md rule 7). Refused here, the
          # same way the publisher refuses it, and never printed.
          case "${GH_TOKEN}" in
            *[[:space:]]*|*[[:cntrl:]]*)
              echo "::error::CHARTS_PUBLISH_TOKEN contains whitespace or a control character, usually a trailing newline. Re-save the org secret by pasting the token at the prompt of 'gh secret set CHARTS_PUBLISH_TOKEN --org krateo-blueprints --visibility all' (not piped from echo). Nothing was tagged or pushed."; exit 1 ;;
          esac
          if ! push="$(gh api repos/krateo-blueprints/charts --jq .permissions.push 2>&1)"; then
            echo "::error::CHARTS_PUBLISH_TOKEN does not authenticate (${push}): expired, revoked or mistyped. Nothing was tagged or pushed."; exit 1
          fi
          if [ "$push" != true ]; then
            echo "::error::CHARTS_PUBLISH_TOKEN cannot write to krateo-blueprints/charts. Nothing was tagged or pushed."; exit 1
          fi

      - uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      # The chart IS the repository root, so without .helmignore the package carries .git/ and .github/
      # too. Checked on every run, pull requests included, so a broken .helmignore is caught before a
      # merge rather than after a release.
      - name: the package carries the chart, not the repository
        run: |
          set -euo pipefail
          [ -f Chart.yaml ] || exit 0
          sed -i 's/CHART_VERSION/0.0.0-check/g' Chart.yaml
          # As release-oci does: charts/ is not committed, and a chart that declares dependencies does
          # not package until they are fetched.
          if grep -q '^dependencies:' Chart.yaml; then
            helm dependency build . >/dev/null 2>&1 || helm dependency update . >/dev/null 2>&1 || true
          fi
          helm package . -d "$RUNNER_TEMP/pkg" >/dev/null
          if tar tzf "$RUNNER_TEMP"/pkg/*.tgz | grep -E '^[^/]+/(\.git|\.github)/'; then
            echo "::error::.helmignore must exclude .git/ and .github/"; exit 1
          fi

  # A tag pushed with GITHUB_TOKEN starts no new run, so the package is built by THIS run's oci job.
  # If someone else pushed the tag first, the push is refused and nothing is released twice.
  tag:
    needs: resolve
    if: needs.resolve.outputs.tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: git tag "$VERSION" "$GITHUB_SHA" && git push origin "refs/tags/$VERSION"

  oci:
    needs:
      - resolve
      - tag
    # `tag` is skipped for a pushed tag; only its failure stops the release.
    if: ${{ !cancelled() && needs.resolve.outputs.release == 'true' && needs.tag.result != 'failure' }}
    uses: krateo-platformops/.github/.github/workflows/release-oci.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      chart_version: ${{ needs.resolve.outputs.version }}
      oci_repo: ${{ needs.resolve.outputs.oci_repo }}
      chart_root: "."

  # After the push, deliberately: the chart is the release, and an asset problem must never stop it
  # from shipping. The release carries the registration file stamped with the version it registers,
  # because the copy on main still says CHART_VERSION for a page set.
  registration:
    needs:
      - resolve
      - oci
    if: ${{ !cancelled() && needs.oci.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          gh release view "$VERSION" -R "$R" >/dev/null 2>&1 \
            || gh release create "$VERSION" -R "$R" --verify-tag --title "$VERSION" \
                 --notes "Register $VERSION from the Krateo portal (builder deliverables -> Register), or apply the attached compositiondefinition.yaml."
          # GHCR gives a new package its repository's visibility.
          if [ "$(gh api "repos/$R" --jq .private)" = true ]; then
            echo "::warning::private repo -> private GHCR package; registering needs chart.credentials"
          fi
          [ -f compositiondefinition.yaml ] || exit 0
          sed -i "s/CHART_VERSION/${VERSION}/g" compositiondefinition.yaml
          gh release upload "$VERSION" compositiondefinition.yaml -R "$R" --clobber

  # The index takes the archive GHCR holds, not a second package (PUBLISHING.md rule 1):
  # release-oci ships the stamped compositiondefinition.yaml inside it. Pulled back rather than handed
  # over, so a version release-oci skipped because it was already published identically is covered
  # too.
  #
  # Except a version published BEFORE release-oci shipped the file. release-oci skips such a version
  # (identical but for the file) and leaves its archive as published, without one, and the
  # publisher would refuse it. Such a version is never handed to the publisher: this job stops at
  # the missing file, so `index` does not run. A version from before the change enters the index only
  # when a new version is released.
  index-archive:
    needs:
      - resolve
      - oci
    if: ${{ !cancelled() && needs.oci.result == 'success' && needs.resolve.outputs.index == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - name: pull the archive GHCR holds
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_REPO: ${{ needs.resolve.outputs.oci_repo }}
          NAME: ${{ needs.resolve.outputs.name }}
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          out="$RUNNER_TEMP/charts-dist"
          mkdir -p "$out"
          helm pull "${OCI_REPO}/${NAME}" --version "$VERSION" --destination "$out"
          tgz="$out/${NAME}-${VERSION}.tgz"
          [ -f "$tgz" ] || { echo "::error::expected ${tgz}, pulled: $(ls "$out")"; exit 1; }
          # A version release-oci published before it shipped CompositionDefinitions keeps its archive
          # without one, because a published version is never replaced (see above). It cannot be
          # listed, so the release stops here, saying so, before the publisher is called.
          if [ "$CHANNEL" != operators ]; then
            members="$(tar tzf "$tgz")"
            if ! grep -qxF "${NAME}/compositiondefinition.yaml" <<< "$members"; then
              echo "::error::GHCR's ${NAME} ${VERSION} has no compositiondefinition.yaml: it was published before release-oci shipped one, and a published version is never replaced. Release a new version to list it."; exit 1
            fi
          fi
          echo "the ${CHANNEL} index gets $(basename "$tgz"), sha256 $(sha256sum "$tgz" | cut -d' ' -f1), as GHCR holds it"

      - uses: actions/upload-artifact@v4
        with:
          # The name and the layout (the .tgz at the root) publish-chart.yaml downloads.
          name: charts-dist
          path: ${{ runner.temp }}/charts-dist/*.tgz
          if-no-files-found: error
          retention-days: 1

  # krateo-blueprints/charts stores the archive in its Releases, merges it into the channel's index,
  # then reads the served index and installs the chart anonymously; the release fails unless all of
  # that succeeds (PUBLISHING.md rule 8).
  index:
    needs:
      - resolve
      - index-archive
    if: ${{ !cancelled() && needs.index-archive.result == 'success' }}
    # Pinned to the publisher's release by its full commit SHA, never a branch or a tag: it receives an
    # org-wide write token, and a SHA cannot move (PUBLISHING.md rule 9). Dependabot
    # (.github/dependabot.yml) proposes each upgrade as a pull request.
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@f0138e816ce827279ad087202889c009899741f7 # 1.0.2
    permissions:
      contents: read
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ needs.resolve.outputs.version }}
      channel: ${{ needs.resolve.outputs.channel }}
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
